<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>RUTA 42 La piedad q</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{
    width:100%; height:100%;
    background:#000; color:#fff;
    font-family:'Segoe UI', Roboto, -apple-system, sans-serif;
    overflow:hidden;
  }
  #visualizador{
    width:100%; height:100dvh;
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    overflow:hidden; position:relative;
  }
  .pantalla-completa{
    width:100%; height:100%;
    position:relative;
    overflow:hidden;
  }
  
  .texto-scroll{
    font-weight:700; 
    letter-spacing:2px;
    text-transform:uppercase;
    white-space:nowrap;
    position:absolute;
    will-change: transform;
  }
  
  .texto-ruta{
    color:#35c2a4; 
    font-size: 80px;
    text-shadow: 0 0 30px rgba(53,194,164,0.7);
    animation: brillo 2s ease-in-out infinite;
  }
  
  @keyframes brillo {
    0%, 100% { text-shadow: 0 0 30px rgba(53,194,164,0.7); }
    50% { text-shadow: 0 0 60px rgba(53,194,164,1); }
  }
  
  .texto-parada{
    color:#fff; 
    font-size: 90px;
    animation: parpadeo 2s ease-in-out infinite;
  }
  
  @keyframes parpadeo {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
  
  .texto-distancia{
    color:#e0a53c; 
    font-size: 85px;
    text-shadow: 0 0 20px rgba(224,165,60,0.5);
  }
  
  .texto-llegada{
    color:#35c2a4; 
    font-size: 80px;
    animation: parpadeo 0.5s ease-in-out infinite;
    text-shadow: 0 0 30px rgba(53,194,164,0.7);
    display:inline-block;
    padding:0 20px;
    text-align:center;
  }

  .mensaje-centrado{
    position:absolute;
    top:50%;
    left:0;
    width:100%;
    transform:translateY(-50%);
    text-align:center;
    white-space:normal;
  }
  
  .aviso-inseguro{
    font-weight:600; 
    color:#e0a53c; 
    text-align:center;
    font-size: clamp(16px, 4.5vw, 28px);
    line-height:1.5;
    max-width:600px;
    padding:20px;
    border:1px solid #e0a53c;
    border-radius:12px;
  }
  
  .controles-tamano{
    position:fixed; 
    bottom:20px; 
    right:20px; 
    z-index:9999;
    display:flex; 
    gap:10px; 
    align-items:center;
  }
  
  .btn-tamano{
    width:50px; 
    height:50px; 
    border-radius:50%;
    background:#16263a; 
    color:#35c2a4;
    border:2px solid #35c2a4; 
    font-size:24px;
    cursor:pointer; 
    font-weight:700;
    transition:0.2s; 
    display:flex; 
    align-items:center; 
    justify-content:center;
    box-shadow:0 4px 16px rgba(0,0,0,0.5);
  }
  
  .btn-tamano:hover{ 
    background:#35c2a4; 
    color:#0b1420; 
  }
  
  .btn-tamano:active{ 
    transform:scale(0.9); 
  }
  
  .btn-retorno{
    position:fixed; 
    bottom:20px; 
    left:20px; 
    z-index:9999;
    background:#16263a; 
    color:#35c2a4;
    border:2px solid #35c2a4; 
    border-radius:12px;
    padding:12px 20px; 
    font-size:16px; 
    font-weight:600;
    cursor:pointer; 
    box-shadow:0 4px 16px rgba(0,0,0,0.5);
    transition:0.2s; 
    font-family:'Segoe UI', Roboto, -apple-system, sans-serif;
  }
  
  .btn-retorno:hover{ 
    background:#35c2a4; 
    color:#0b1420; 
  }
  
  .btn-retorno:active{ 
    transform:scale(0.95); 
  }

  @media (min-width: 768px) {
    .texto-ruta{ font-size: 100px; }
    .texto-parada{ font-size: 110px; }
    .texto-distancia{ font-size: 105px; }
  }

  @media (orientation: landscape) and (max-height: 500px) {
    .texto-ruta{ font-size: 60px; }
    .texto-parada{ font-size: 70px; }
    .texto-distancia{ font-size: 65px; }
  }
</style>
</head>
<body>

<div id="visualizador">
  <div class="pantalla-completa" id="pantallaScroll"></div>
</div>

<div class="controles-tamano">
  <button class="btn-tamano" onclick="disminuirTamano()" title="Disminuir texto">A-</button>
  <button class="btn-tamano" onclick="aumentarTamano()" title="Aumentar texto">A+</button>
</div>

<button class="btn-retorno" onclick="window.location.href='index.html'">
  🏠 Generar Otra Ruta
</button>

<script>
  const RUTA = [{"nombre":"Crucero","lat":20.5746769,"lng":-100.4009046,"timestamp":"2026-09-01T15:05:28.408Z"},{"nombre":"Michellin","lat":20.5786189,"lng":-100.4007286,"timestamp":"2026-09-01T15:06:26.798Z"},{"nombre":"El vegil a corregidora","lat":20.4396649,"lng":-100.3589638,"timestamp":"2026-09-01T16:22:56.884Z"},{"nombre":"2469","lat":20.4444095,"lng":-100.3623328,"timestamp":"2026-09-01T16:43:09.032Z"}];
  const NOMBRE_RUTA = '42 La piedad q';
  
  let indiceParadaActual = 0;
  let pantallaActual = 0;
  let pantallaScroll = document.getElementById('pantallaScroll');
  let escalaTexto = 1;
  const escalaMinima = 0.5;
  const escalaMaxima = 3;
  const pasoEscala = 0.25;
  let watchId = null;
  let ultimaPosicion = null;
  let llegando = false;
  let animacionActiva = false;
  let timerPantalla = null;
  let timerLlegada = null;
  
  // Velocidad del scroll: pixeles por segundo (más alto = más rápido)
  const VELOCIDAD_SCROLL_PX_S = 300;
  // Tiempo mínimo que dura cada pantalla
  const TIEMPO_MINIMO_PANTALLA = 6000;

  function extraerReferencias(texto) {
    if (!texto) return { nombrePrincipal: '', referencias: [] };
    const partes = texto.split('&');
    const nombrePrincipal = partes[0].trim();
    const referencias = partes.slice(1).map(ref => ref.trim()).filter(ref => ref);
    return { nombrePrincipal, referencias };
  }

  function calcularDistancia(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c * 1000;
  }

  function formatearDistancia(metros) {
    if (metros < 1000) return Math.round(metros) + ' m';
    return (metros / 1000).toFixed(1) + ' km';
  }

  function getBaseFontSize(claseCSS) {
    if (claseCSS === 'texto-ruta') return 80;
    if (claseCSS === 'texto-parada') return 90;
    if (claseCSS === 'texto-distancia') return 85;
    return 80;
  }

  function aumentarTamano() {
    if (escalaTexto < escalaMaxima) {
      escalaTexto += pasoEscala;
      aplicarEscalaTexto();
    }
  }

  function disminuirTamano() {
    if (escalaTexto > escalaMinima) {
      escalaTexto -= pasoEscala;
      aplicarEscalaTexto();
    }
  }

  function aplicarEscalaTexto() {
    const elementos = pantallaScroll.querySelectorAll('.texto-scroll, .texto-llegada');
    elementos.forEach(function(el) {
      let tamanoBase = 80;
      if (el.classList.contains('texto-parada')) tamanoBase = 90;
      if (el.classList.contains('texto-distancia')) tamanoBase = 85;
      if (el.classList.contains('texto-llegada')) tamanoBase = 80;
      
      el.style.fontSize = (tamanoBase * escalaTexto) + 'px';
    });
  }

  function mostrarPantallaScroll(indice) {
    if (llegando) return;

    const parada = RUTA[indiceParadaActual];
    if (!parada) return;

    let claseCSS = '';
    let texto = '';
    
    if (indice === 0) {
      const { nombrePrincipal, referencias } = extraerReferencias(NOMBRE_RUTA);
      let textoRuta = 'RUTA ' + nombrePrincipal;
      if (referencias.length > 0) {
        textoRuta += ' & ' + referencias.join(' & ');
      }
      texto = textoRuta;
      claseCSS = 'texto-ruta';
    } else if (indice === 1) {
      const { nombrePrincipal, referencias } = extraerReferencias(parada.nombre);
      let textoParada = 'PRÓXIMA PARADA: ' + nombrePrincipal;
      if (referencias.length > 0) {
        textoParada += ' & ' + referencias.join(' & ');
      }
      texto = textoParada;
      claseCSS = 'texto-parada';
    } else {
      let textoDistancia = 'DISTANCIA: CALCULANDO...';
      if (ultimaPosicion) {
        const distancia = calcularDistancia(
          ultimaPosicion.lat,
          ultimaPosicion.lng,
          parada.lat,
          parada.lng
        );
        textoDistancia = 'DISTANCIA: ' + formatearDistancia(distancia);
      }
      texto = textoDistancia;
      claseCSS = 'texto-distancia';
    }

    pantallaScroll.innerHTML = '';
    const textoEl = document.createElement('div');
    textoEl.className = 'texto-scroll ' + claseCSS;
    textoEl.textContent = texto;
    textoEl.style.fontSize = getBaseFontSize(claseCSS) * escalaTexto + 'px';
    pantallaScroll.appendChild(textoEl);

    iniciarAnimacionScroll(textoEl, indice);
  }

  function iniciarAnimacionScroll(elemento, indicePantalla) {
    const pantallaWidth = pantallaScroll.offsetWidth;
    const textoWidth = elemento.scrollWidth;
    
    let posX = pantallaWidth;
    elemento.style.transform = 'translateX(' + posX + 'px)';
    elemento.style.left = '0';
    elemento.style.top = '50%';
    elemento.style.marginTop = '-' + (elemento.offsetHeight / 2) + 'px';
    
    const distanciaTotal = pantallaWidth + textoWidth;
    let duracion = distanciaTotal / VELOCIDAD_SCROLL_PX_S * 1000;
    
    if (duracion < TIEMPO_MINIMO_PANTALLA) {
      duracion = TIEMPO_MINIMO_PANTALLA;
    }
    
    const inicio = performance.now();
    animacionActiva = true;
    
    function animar(timestamp) {
      if (llegando) {
        animacionActiva = false;
        return;
      }
      
      const progreso = (timestamp - inicio) / duracion;
      
      if (progreso < 1) {
        const nuevaPos = pantallaWidth - (distanciaTotal * progreso);
        elemento.style.transform = 'translateX(' + nuevaPos + 'px)';
        requestAnimationFrame(animar);
      } else {
        animacionActiva = false;
        if (timerPantalla) clearTimeout(timerPantalla);
        timerPantalla = setTimeout(function() {
          pantallaActual = (indicePantalla + 1) % 3;
          mostrarPantallaScroll(pantallaActual);
        }, 500);
      }
    }
    
    requestAnimationFrame(animar);
  }

  function iniciarCicloScroll() {
    pantallaActual = 0;
    mostrarPantallaScroll(0);
  }

  function verificarProximidad(pos) {
    const parada = RUTA[indiceParadaActual];
    if (!parada) return;
    
    const distancia = calcularDistancia(
      pos.coords.latitude,
      pos.coords.longitude,
      parada.lat,
      parada.lng
    );
    
    if (distancia < 20 && !llegando) {
      llegando = true;
      if (timerPantalla) clearTimeout(timerPantalla);
      
      pantallaScroll.innerHTML = '';
      const llegadaEl = document.createElement('div');
      llegadaEl.className = 'texto-llegada';
      llegadaEl.textContent = 'LLEGANDO A: ' + parada.nombre;
      llegadaEl.style.fontSize = (getBaseFontSize('texto-ruta') * escalaTexto) + 'px';
      pantallaScroll.appendChild(llegadaEl);
      
      llegadaEl.style.position = 'absolute';
      llegadaEl.style.top = '50%';
      llegadaEl.style.left = '50%';
      llegadaEl.style.transform = 'translate(-50%, -50%)';
      llegadaEl.style.textAlign = 'center';
      llegadaEl.style.width = '100%';
      llegadaEl.style.padding = '0 20px';
      
      if (timerLlegada) clearTimeout(timerLlegada);
      timerLlegada = setTimeout(function() {
        llegando = false;
        indiceParadaActual++;
        if (indiceParadaActual >= RUTA.length) {
          indiceParadaActual = 0;
        }
        pantallaActual = 0;
        iniciarCicloScroll();
      }, 5000);
    } else if (!llegando && pantallaActual === 2) {
      actualizarTextoDistancia();
    }
  }

  function actualizarTextoDistancia() {
    const parada = RUTA[indiceParadaActual];
    const el = pantallaScroll.querySelector('.texto-distancia');
    if (!parada || !el || !ultimaPosicion) return;
    const distancia = calcularDistancia(
      ultimaPosicion.lat, ultimaPosicion.lng, parada.lat, parada.lng
    );
    el.textContent = 'DISTANCIA: ' + formatearDistancia(distancia);
  }

  function iniciarGPS() {
    if (!window.isSecureContext) {
      pantallaScroll.innerHTML =
        '<div class="aviso-inseguro">⚠️ Este archivo se abrió sin HTTPS (o como archivo local).<br><br>' +
        'El navegador bloquea el GPS en este modo por seguridad.<br><br>' +
        'Sube este HTML a un hosting con HTTPS para que el tránsito funcione.</div>';
      return;
    }

    if (!navigator.geolocation) {
      alert('Tu dispositivo no soporta GPS');
      return;
    }

    watchId = navigator.geolocation.watchPosition(
      function(pos) {
        ultimaPosicion = {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude
        };
        verificarProximidad(pos);
      },
      function(error) {
        console.error('Error GPS:', error);
      },
      {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 5000
      }
    );
  }

  // Iniciar GPS y ciclo de scroll
  iniciarGPS();
  
  if (window.isSecureContext && RUTA.length > 0) {
    iniciarCicloScroll();
  }

  document.body.addEventListener('click', function(e) {
    if (e.target.tagName === 'BUTTON') return;
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  });
</script>
</body>
</html>
