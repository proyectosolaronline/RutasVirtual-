<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Generador de Ruta</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<style>
  :root{
    --bg:#0b1420;
    --panel:#101c2c;
    --panel-alt:#16263a;
    --line:#223449;
    --text:#e8eef5;
    --text-dim:#8ea3b8;
    --accent:#35c2a4;
    --warn:#e0a53c;
    --danger:#e05a4e;
  }

  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
  }

  html, body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI', Roboto, -apple-system, sans-serif;
    -webkit-tap-highlight-color:transparent;
  }

  #app{
    display:flex;
    flex-direction:column;
    height:100dvh;
    overflow:hidden;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:6px;
    padding: 8px 12px;
    border-bottom:1px solid var(--line);
    background: var(--panel);
    min-height: 52px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:8px;
  }

  .dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 3px rgba(53,194,164,0.15);
  }

  .brand h1{
    font-size:14px;
    margin:0;
    font-weight:600;
  }

  nav{
    display:flex;
    gap:6px;
    align-items:center;
    flex-wrap: wrap;
  }

  nav button{
    color:var(--text);
    background: transparent;
    border:1px solid var(--line);
    padding:6px 10px;
    border-radius:6px;
    font-size:12px;
    cursor:pointer;
    white-space:nowrap;
  }

  nav button:hover{
    border-color: var(--accent);
    color: var(--accent);
  }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
    position:relative;
  }

  #mapa{
    flex:1;
    width:100%;
    height:100%;
    z-index:1;
  }

  aside{
    width:100%;
    max-height:45vh;
    background: var(--panel);
    border-top:1px solid var(--line);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    transition: max-height 0.3s ease;
    z-index:10;
    position: relative;
  }

  aside.colapsado{
    max-height: 0;
    border-top:none;
  }

  .aside-tabs{
    display:flex;
    border-bottom:1px solid var(--line);
    background:var(--panel-alt);
    flex-shrink:0;
  }

  .aside-tabs button{
    flex:1;
    background:none;
    border:none;
    color: var(--text-dim);
    padding:10px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    border-bottom:2px solid transparent;
    transition:0.2s;
  }

  .aside-tabs button.activo{
    color: var(--accent);
    border-bottom-color: var(--accent);
    background: rgba(53,194,164,0.05);
  }

  .panel-lista{
    flex:1;
    overflow-y:auto;
    padding:10px;
    display:none;
    -webkit-overflow-scrolling:touch;
  }

  .panel-lista.activo{
    display:block;
  }

  .toggle-panel{
    position:absolute;
    top:-28px;
    left:50%;
    transform:translateX(-50%);
    background:var(--panel);
    border:1px solid var(--line);
    border-bottom:none;
    color:var(--text-dim);
    padding:4px 16px;
    border-radius:12px 12px 0 0;
    font-size:18px;
    cursor:pointer;
    z-index:20;
    line-height:1.2;
    box-shadow:0 -2px 8px rgba(0,0,0,0.4);
  }

  .toggle-panel:hover{
    color:var(--accent);
  }

  .fab-container{
    position:fixed;
    bottom:20px;
    right:20px;
    display:flex;
    flex-direction:column;
    gap:12px;
    z-index:9999;
  }

  .fab{
    width:56px;
    height:56px;
    border-radius:50%;
    border:none;
    background:var(--accent);
    color:#fff;
    font-size:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 16px rgba(53,194,164,0.4);
    cursor:pointer;
    transition:0.2s;
    position: relative;
  }

  .fab:active{
    transform:scale(0.92);
  }

  .fab.secondary{
    background:var(--panel-alt);
    border:1px solid var(--line);
    box-shadow:0 4px 16px rgba(0,0,0,0.5);
  }

  .fab span{
    position:absolute;
    right:64px;
    background:var(--panel);
    padding:4px 12px;
    border-radius:6px;
    font-size:12px;
    white-space:nowrap;
    color:var(--text);
    border:1px solid var(--line);
    opacity:0;
    pointer-events:none;
    transition:0.2s;
  }

  .fab:hover span{
    opacity:1;
  }

  .modal-overlay{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.7);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:10000;
    padding:20px;
  }

  .modal-overlay.activo{
    display:flex;
  }

  .modal{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:24px;
    width:100%;
    max-width:360px;
    text-align:center;
  }

  .modal h3{
    font-size:16px;
    margin-bottom:12px;
    font-weight:600;
  }

  .modal p{
    font-size:14px;
    color:var(--text-dim);
    margin-bottom:16px;
  }

  .modal input{
    width:100%;
    padding:12px 14px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--text);
    font-size:16px;
    outline:none;
    margin-bottom:16px;
  }

  .modal input:focus{
    border-color:var(--accent);
  }

  .modal-buttons{
    display:flex;
    gap:10px;
  }

  .modal-buttons button{
    flex:1;
    padding:12px;
    border-radius:8px;
    border:none;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:0.2s;
  }

  .btn-confirmar{
    background:var(--accent);
    color:#fff;
  }

  .btn-cancelar{
    background:var(--panel-alt);
    color:var(--text);
    border:1px solid var(--line) !important;
  }

  .item-parada{
    background: var(--panel-alt);
    border:1px solid var(--line);
    border-radius:10px;
    padding: 12px 14px;
    margin-bottom:8px;
    cursor:pointer;
    transition:0.15s;
  }

  .item-parada:active{
    transform:scale(0.98);
    background:var(--panel);
  }

  .item-parada .nombre{
    font-size:15px;
    font-weight:600;
  }

  .item-parada .meta{
    font-size:12px;
    color: var(--text-dim);
    margin-top:4px;
  }

  .vacio{
    text-align:center;
    color: var(--text-dim);
    font-size:13px;
    padding: 40px 10px;
  }

  @media (min-width: 820px) {
    main{ flex-direction:row; }

    aside{
      width:340px;
      min-width:280px;
      max-height:100%;
      border-top:none;
      border-left:1px solid var(--line);
    }

    .toggle-panel{ display:none; }
    .fab-container{ bottom:30px; right:30px; }
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand">
      <div class="dot"></div>
      <h1>Generador de Ruta</h1>
    </div>
    <nav>
      <button onclick="terminarRuta()">🏁 Terminar Ruta</button>
      <button onclick="limpiarRuta()">🗑️ Limpiar</button>
    </nav>
  </header>

  <main>
    <div id="mapa"></div>

    <aside id="panelLateral">
      <button class="toggle-panel" id="btnTogglePanel">⌃</button>
      <div class="aside-tabs">
        <button class="activo" data-tab="paradas">📍 Paradas</button>
        <button data-tab="info">ℹ️ Info</button>
      </div>

      <div class="panel-lista activo" id="panelParadas">
        <div class="vacio">Cargando paradas guardadas...</div>
      </div>

      <div class="panel-lista" id="panelInfo">
        <div class="vacio">
          <strong>Instrucciones:</strong><br><br>
          1️⃣ Recorre la ruta en tu vehículo.<br>
          2️⃣ Presiona 📍 cuando estés en una parada.<br>
          3️⃣ Confirma la ubicación GPS.<br>
          4️⃣ Escribe el nombre de la parada.<br>
          5️⃣ Al finalizar, presiona 🏁 Terminar Ruta.
        </div>
      </div>
    </aside>
  </main>
</div>

<div class="fab-container">
  <button class="fab" id="btnAgregarParada" title="Agregar Parada">
    📍
    <span>Agregar Parada</span>
  </button>
  <button class="fab secondary" id="btnCentrar" title="Centrar en mi ubicación">
    🎯
    <span>Centrar en mi ubicación</span>
  </button>
</div>

<div class="modal-overlay" id="modalConfirmar">
  <div class="modal">
    <h3>¿Es aquí la parada?</h3>
    <p id="modalCoords"></p>
    <div class="modal-buttons">
      <button class="btn-cancelar" onclick="cerrarModal()">No</button>
      <button class="btn-confirmar" onclick="confirmarParada()">Sí</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalNombre">
  <div class="modal">
    <h3>Nombre de la parada</h3>
    <input type="text" id="inputNombre" placeholder="Ej: Universidad" autocomplete="off">
    <div class="modal-buttons">
      <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-confirmar" onclick="guardarParada()">Guardar</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script>
  // ===== VARIABLES GLOBALES =====
  let mapa;
  let marcadorUsuario;
  let marcadoresParadas = [];
  let paradas = [];
  let ubicacionActual = { lat: null, lng: null };
  let panelColapsado = false;

  // ===== INICIAR MAPA =====
  function iniciarMapa() {
    const capaSatelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: '© Esri'
    });

    const capaCalle = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    });

    mapa = L.map('mapa', {
      center: [20.5881, -100.3899],
      zoom: 13,
      layers: [capaSatelite]
    });

    L.control.layers({
      '🌍 Calle': capaCalle,
      '🛰️ Satélite': capaSatelite
    }, null, { position: 'topright' }).addTo(mapa);

    cargarParadasGuardadas();
    iniciarGeolocalizacion();
  }

  // ===== CARGAR PARADAS GUARDADAS =====
  function cargarParadasGuardadas() {
    const datos = localStorage.getItem('paradasRuta');
    if (datos) {
      try {
        paradas = JSON.parse(datos);
        if (paradas.length > 0) {
          paradas.forEach(function(p) {
            agregarMarcadorParada(p);
          });
          renderizarParadas();
          const ultima = paradas[paradas.length - 1];
          mapa.setView([ultima.lat, ultima.lng], 14);
        }
      } catch(e) {
        console.error('Error cargando localStorage:', e);
      }
    } else {
      renderizarParadas();
    }
  }

  // ===== GEOLOCALIZACIÓN =====
  function iniciarGeolocalizacion() {
    if (!navigator.geolocation) {
      alert('Tu dispositivo no soporta GPS');
      return;
    }

    navigator.geolocation.watchPosition(
      function(pos) {
        ubicacionActual.lat = pos.coords.latitude;
        ubicacionActual.lng = pos.coords.longitude;

        if (!marcadorUsuario) {
          marcadorUsuario = L.circleMarker([ubicacionActual.lat, ubicacionActual.lng], {
            radius: 8,
            color: '#35c2a4',
            fillColor: '#35c2a4',
            fillOpacity: 0.8
          }).addTo(mapa);
        } else {
          marcadorUsuario.setLatLng([ubicacionActual.lat, ubicacionActual.lng]);
        }

        if (!mapa.__centrado && paradas.length === 0) {
          mapa.setView([ubicacionActual.lat, ubicacionActual.lng], 15);
          mapa.__centrado = true;
        }
      },
      function(error) {
        console.error('Error GPS:', error);
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
    );
  }

  // ===== CENTRAR EN MI UBICACIÓN =====
  document.getElementById('btnCentrar').addEventListener('click', function() {
    if (ubicacionActual.lat && ubicacionActual.lng) {
      mapa.setView([ubicacionActual.lat, ubicacionActual.lng], 16);
    } else {
      alert('Todavía no se obtiene tu ubicación GPS.');
    }
  });

  // ===== AGREGAR PARADA =====
  document.getElementById('btnAgregarParada').addEventListener('click', function() {
    if (!ubicacionActual.lat || !ubicacionActual.lng) {
      alert('Espera a que el GPS obtenga tu ubicación.');
      return;
    }

    document.getElementById('modalCoords').textContent = 
      'Lat: ' + ubicacionActual.lat.toFixed(6) + ' | Lon: ' + ubicacionActual.lng.toFixed(6);
    document.getElementById('modalConfirmar').classList.add('activo');
  });

  // ===== CONFIRMAR PARADA =====
  function confirmarParada() {
    cerrarModal();
    document.getElementById('modalNombre').classList.add('activo');
    document.getElementById('inputNombre').focus();
  }

  // ===== GUARDAR PARADA =====
  function guardarParada() {
    const nombre = document.getElementById('inputNombre').value.trim();
    if (!nombre) {
      alert('Escribe el nombre de la parada.');
      return;
    }

    const parada = {
      nombre: nombre,
      lat: ubicacionActual.lat,
      lng: ubicacionActual.lng,
      timestamp: new Date().toISOString()
    };

    paradas.push(parada);
    guardarEnLocalStorage();
    agregarMarcadorParada(parada);
    renderizarParadas();

    document.getElementById('inputNombre').value = '';
    cerrarModal();
  }

  // ===== AGREGAR MARCADOR =====
  function agregarMarcadorParada(parada) {
    const marcador = L.marker([parada.lat, parada.lng], { draggable: false }).addTo(mapa);
    marcador.bindPopup('<strong>' + escapeHtml(parada.nombre) + '</strong>');
    marcadoresParadas.push(marcador);
  }

  // ===== RENDERIZAR PARADAS =====
  function renderizarParadas() {
    const panel = document.getElementById('panelParadas');
    if (!paradas.length) {
      panel.innerHTML = '<div class="vacio">No hay paradas capturadas aún.</div>';
      return;
    }

    panel.innerHTML = paradas.map(function(p, i) {
      return '<div class="item-parada" onclick="centrarParada(' + i + ')">' +
        '<div class="nombre">' + (i + 1) + '. ' + escapeHtml(p.nombre) + '</div>' +
        '<div class="meta">Lat: ' + p.lat.toFixed(6) + ' | Lon: ' + p.lng.toFixed(6) + '</div>' +
        '</div>';
    }).join('');
  }

  // ===== CENTRAR EN PARADA =====
  function centrarParada(index) {
    const p = paradas[index];
    if (p) {
      mapa.setView([p.lat, p.lng], 17);
      marcadoresParadas[index].openPopup();
    }
  }

  // ===== GUARDAR EN LOCALSTORAGE =====
  function guardarEnLocalStorage() {
    localStorage.setItem('paradasRuta', JSON.stringify(paradas));
  }

  // ===== LIMPIAR RUTA =====
  function limpiarRuta() {
    if (paradas.length && confirm('¿Seguro que quieres limpiar todas las paradas?')) {
      paradas = [];
      marcadoresParadas.forEach(function(m) { m.remove(); });
      marcadoresParadas = [];
      localStorage.removeItem('paradasRuta');
      renderizarParadas();
    }
  }

  // ===== TERMINAR RUTA (se conecta con la Parte 2) =====
  function terminarRuta() {
    if (!paradas.length) {
      alert('No hay paradas capturadas.');
      return;
    }

    const nombreRuta = prompt('Nombre de la ruta (ej: Universidad):', 'RUTA');
    if (!nombreRuta) return;

    const html = generarVisualizador(nombreRuta);
    descargarHTML(html, 'RUTA_' + nombreRuta + '.html');
  }

  // ===== DESCARGAR HTML =====
  function descargarHTML(contenido, nombreArchivo) {
    const blob = new Blob([contenido], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nombreArchivo;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ===== MODAL =====
  function cerrarModal() {
    document.getElementById('modalConfirmar').classList.remove('activo');
    document.getElementById('modalNombre').classList.remove('activo');
  }

  // ===== PANEL MÓVIL =====
  function alternarPanel() {
    const aside = document.getElementById('panelLateral');
    const btn = document.getElementById('btnTogglePanel');
    panelColapsado = !panelColapsado;
    aside.classList.toggle('colapsado');
    btn.textContent = panelColapsado ? '⌄' : '⌃';
    setTimeout(() => mapa.invalidateSize(), 350);
  }

  document.getElementById('btnTogglePanel').addEventListener('click', alternarPanel);

  // ===== TABS =====
  document.querySelectorAll('.aside-tabs button').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.aside-tabs button').forEach(function(b) { b.classList.remove('activo'); });
      document.querySelectorAll('.panel-lista').forEach(function(p) { p.classList.remove('activo'); });
      btn.classList.add('activo');
      document.getElementById('panel' + (btn.dataset.tab === 'paradas' ? 'Paradas' : 'Info')).classList.add('activo');
      if (window.innerWidth < 820 && panelColapsado) alternarPanel();
    });
  });

  // ===== UTILIDADES =====
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  // ===== INICIAR =====
  window.addEventListener('DOMContentLoaded', iniciarMapa);
</script>

</body>
</html>
